name: profile stats

# Refreshes the 03 ACTIVITY section of assets/profile.svg from live GitHub data.
# stats.py collects -> stats.json; build.py renders -> assets/profile.svg.
# Uses the built-in GITHUB_TOKEN. No personal access token, no third-party service.
on:
  schedule:
    - cron: "17 3 * * *"      # daily 03:17 UTC (08:17 PKT)
  workflow_dispatch:           # run by hand from the Actions tab
  push:
    paths: ["stats.py", "build.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python stats.py

      - name: Render profile.svg
        run: python build.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/profile.svg stats.json; then
            echo "no change"
          else
            git add assets/profile.svg stats.json
            git commit -m "chore: refresh profile stats [skip ci]"
            git push
          fi
