<svg xmlns="http://www.w3.org/2000/svg" width="860" height="362" viewBox="0 0 860 362" fill="none" role="img">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#332a35" stroke-width="1" opacity=".22"/>
    </pattern>
    <radialGradient id="glowA" cx="10%" cy="0%" r="68%">
      <stop offset="0%" stop-color="#9b1b30" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#9b1b30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="94%" cy="100%" r="62%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity=".11"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d94a5f" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#a487bd" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dot" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="858" height="360" rx="14" fill="#14141a"/><rect x="1" y="1" width="858" height="360" rx="14" fill="url(#grid)"/><rect x="1" y="1" width="858" height="360" rx="14" fill="url(#glowA)"/><rect x="1" y="1" width="858" height="360" rx="14" fill="url(#glowB)"/><rect x="1" y="1" width="858" height="360" rx="14" fill="none" stroke="#332a35" stroke-width="1.5"/><g transform="translate(0,0)">
    <path d="M1 14 A14 14 0 0 1 15 1 H845 A14 14 0 0 1 859 14 V36 H1 Z" fill="#0e0e13"/>
    <line x1="1" y1="36" x2="859" y2="36" stroke="#332a35" stroke-width="1.5"/>
    <circle cx="22" cy="18.0" r="5.5" fill="#9b1b30" opacity=".9"/>
    <circle cx="42" cy="18.0" r="5.5" fill="#d9b64a" opacity=".9"/>
    <circle cx="62" cy="18.0" r="5.5" fill="#93ae72" opacity=".9"/>
    <text x="430.0" y="22.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12"
          fill="#7f7480" letter-spacing="1">~/noor — cat principles.yml</text>
  </g><text x="32.0" y="74.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#7f7480"># ~/noor/principles.yml</text><text x="32.0" y="114.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">build:</text><text x="32.0" y="134.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">  - </text><text x="62.0" y="134.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9">"Ship the ugly version that runs. Beauty is a refactor away; usage isn't."</text><text x="32.0" y="154.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">  - </text><text x="62.0" y="154.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9">"If it needs me awake to work, it isn't finished."</text><text x="32.0" y="174.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">  - </text><text x="62.0" y="174.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9">"Read the source before the tutorial."</text><text x="32.0" y="214.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#c9a227">teach:</text><text x="32.0" y="234.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">  - </text><text x="62.0" y="234.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9">"Write the algorithm before importing it. Once. Then import forever."</text><text x="32.0" y="254.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">  - </text><text x="62.0" y="254.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9">"A student who can explain it out loud has actually learned it."</text><text x="32.0" y="294.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#6faa96">business:</text><text x="32.0" y="314.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">  - </text><text x="62.0" y="314.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9">"Pakistani SMEs don't need AI. They need their Tuesday back."</text><text x="32.0" y="334.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">  - </text><text x="62.0" y="334.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9">"Automate the boring thing first — trust is earned on small wins."</text>
</svg>
