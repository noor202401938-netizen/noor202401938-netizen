.</text><circle cx="43" cy="928" r="2.6" fill="#d94a5f" opacity=".8"/><text x="56.0" y="932.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9" font-weight="700">SixtyHours</text><text x="141.0" y="932.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#7f7480">— running the current cohort across the ML/AI and Software Dev tracks.</text><circle cx="43" cy="950" r="2.6" fill="#d94a5f" opacity=".8"/><text x="56.0" y="954.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9" font-weight="700">PK AI infrastructure</text><text x="216.0" y="954.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#7f7480">— local-context tooling that doesn't assume a US-shaped business.</text><circle cx="43" cy="972" r="2.6" fill="#d94a5f" opacity=".8"/><text x="56.0" y="976.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9" font-weight="700">Content</text><text x="118.5" y="976.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#7f7480">— writing up what actually works, so the next person skips a month.</text><rect x="40" y="1016" width="780" height="1" fill="url(#hair)"/><text x="40.0" y="1056.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#7f7480" letter-spacing="2">LOCATION</text><text x="176.0" y="1056.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#e8e3d9">Faisalabad, Pakistan</text><text x="40.0" y="1084.0" xml:space="preserve" font-fami