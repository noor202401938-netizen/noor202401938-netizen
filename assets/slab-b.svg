-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#c9a227">  voice-agent-core/      </text><text x="227.5" y="138.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#7f7480"># telephony + STT + LLM + TTS loop, sub-second turn-taking</text><text x="40.0" y="158.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#c9a227">  n8n-sme-workflows/     </text><text x="227.5" y="158.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#7f7480"># reusable automation blueprints for non-technical teams</text><text x="40.0" y="178.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#c9a227">  sixtyhours-platform/   </text><text x="227.5" y="178.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#7f7480"># cohort, submissions and mentor tooling</text><text x="40.0" y="198.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#c9a227">  retrieval-lab/         </text><text x="227.5" y="198.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#7f7480"># BM25 + FAISS from scratch, no LangChain</text><text x="40.0" y="238.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#93ae72">noor@github</text><text x="122.5" y="238.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#7f7480"> ~ </text><text x="145.0" y="238.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">$</text><text x="152.5" y="238.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#7f7480">  # replace these with your real repos — one line, one truth</text><rect x="40" y="278" width="780" height="1" fill="url(#hair)"/><rect x="40" y="301" width="42" height="26" rx="7" fill="#c9a227" fill-opacity=".14" stroke="#c9a227" stroke-opacity=".45" stroke-width="1.1"/><text x="61.0" y="319.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#c9a227" font-weight="700" letter-spacing="1" text-anchor="middle">05</text><text x="98.0" y="319.5" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="16.5" fill="#e8e3d9" font-weight="700" letter-spacing="3.2">PRINCIPLES</text><rect x="249" y="313.5" width="401" height="1.5" rx="1" fill="url(#rule)"/><text x="820.0" y="319.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#7f7480" text-anchor="end">// how I make decisions</text><rect x="40" y="362" width="3" height="66" rx="1.5" fill="#d94a5f" opacity=".9"/><text x="58.0" y="378.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11.5" fill="#7f7480" letter-spacing="2.4">// CORE AXIOM</text><text filter="url(#soft)" x="58.0" y="414.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="31" fill="#c9a227" font-weight="700" opacity=".28">Systems &gt; shortcuts. Always.</text><text x="58.0" y="414.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="31" fill="#e8e3d9" font-weight="700">Systems &gt; shortcuts. Always.</text><text x="58.0" y="436.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#7f7480">A thing that works once is a demo. A thing that works unattended is a product.</text><text x="40.0" y="462.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#7f7480"># ~/noor/principles.yml</text><text x="40.0" y="502.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">build:</text><text x="40.0" y="522.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">  - </text><text x="70.0" y="522.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9">"Ship the ugly version that runs. Beauty is a refactor away; usage isn't."</text><text x="40.0" y="542.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">  - </text><text x="70.0" y="542.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9">"If it needs me awake to work, it isn't finished."</text><text x="40.0" y="562.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">  - </text><text x="70.0" y="562.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9">"Read the source before the tutorial."</text><text x="40.0" y="602.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#c9a227">teach:</text><text x="40.0" y="622.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">  - </text><text x="70.0" y="622.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9">"Write the algorithm before importing it. Once. Then import forever."</text><text x="40.0" y="642.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">  - </text><text x="70.0" y="642.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9">"A student who can explain it out loud has actually learned it."</text><text x="40.0" y="682.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#6faa96">business:</text><text x="40.0" y="702.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">  - </text><text x="70.0" y="702.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9">"Pakistani SMEs don't need AI. They need their Tuesday back."</text><text x="40.0" y="722.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#d94a5f">  - </text><text x="70.0" y="722.0" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12.5" fill="#e8e3d9">"Automate the boring thing first — trust is earned on small wins."</text><rect x="40" y="758" width="780" height="1" fill="url(#hair)"/><rect x="40" y="781" width="42" height="26" rx="7" fill="#d9b64a" fill-opacity=".14" stroke="#d9b64a" stroke-opacity=".45" stroke-width="1.1"/><text x="6