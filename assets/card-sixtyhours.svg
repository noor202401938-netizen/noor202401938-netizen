  <rect x="1" y="1" width="416" height="340" rx="13" fill="#21222c"/><rect x="1" y="1" width="416" height="340" rx="13" fill="url(#grid)"/><rect x="1" y="1" width="416" height="340" rx="13" fill="url(#glowA)"/><rect x="1" y="1" width="416" height="340" rx="13" fill="url(#glowB)"/><rect x="1" y="1" width="416" height="340" rx="13" fill="none" stroke="#44475a" stroke-width="1.5"/><g transform="translate(0,0)">
