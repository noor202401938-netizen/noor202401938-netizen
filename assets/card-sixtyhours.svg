<svg xmlns="http://www.w3.org/2000/svg" width="418" height="342" viewBox="0 0 418 342" fill="none" role="img">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#44475a" stroke-width="1" opacity=".22"/>
    </pattern>
    <radialGradient id="glowA" cx="12%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#bd93f9" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#bd93f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="92%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#8be9fd" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#8be9fd" stop-opacity="0"/>
