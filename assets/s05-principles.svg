<svg xmlns="http://www.w3.org/2000/svg" width="860" height="58" viewBox="0 0 860 58" fill="none" role="img">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#332a35" stroke-width="1" opacity=".22"/>
    </pattern>
    <radialGradient id="glowA" cx="10%" cy="0%" r="68%">
      <stop offset="0%" stop-color="#9b1b30" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#9b1b30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="94%" cy="100%" r="62%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity=".11"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d94a5f" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#a487bd" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dot" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="858" height="56" rx="11" fill="#14141a"/><rect x="1" y="1" width="858" height="56" rx="11" fill="url(#grid)"/><rect x="1" y="1" width="858" height="56" rx="11" fill="url(#glowA)"/><rect x="1" y="1" width="858" height="56" rx="11" fill="url(#glowB)"/><rect x="1" y="1" width="858" height="56" rx="11" fill="none" stroke="#332a35" stroke-width="1.5"/><rect x="14" y="12" width="52" height="34" rx="8" fill="#c9a227" fill-opacity=".14" stroke="#c9a227" stroke-opacity=".45" stroke-width="1.2"/><text x="40" y="34.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="14" font-weight="700" letter-spacing="1" fill="#c9a227">05</text><text x="82" y="35" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="17" font-weight="700" letter-spacing="3.2" fill="#e8e3d9">PRINCIPLES</text><rect x="238" y="28.5" width="447" height="1.6" rx="1" fill="url(#rule)"/><text x="842" y="34" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#7f7480">// how I make decisions</text>
</svg>
