  <rect x="1" y="1" width="858" height="164" rx="14" fill="#21222c"/><rect x="1" y="1" width="858" height="164" rx="14" fill="url(#grid)"/><rect x="1" y="1" width="858" height="164" rx="14" fill="url(#glowA)"/><rect x="1" y="1" width="858" height="164" rx="14" fill="url(#glowB)"/><rect x="1" y="1" width="858" height="164" rx="14" fill="none" stroke="#44475a" stroke-width="1.5"/><path d="M1 15 A14 14 0 0 1 15 1 H6 V165 H15 A14 14 0 0 1 1 151 Z" fill="#bd93f9" opacity=".9"/><rect x="5" y="1" width="2" height="164" fill="#bd93f9" opacity=".9"/><text x="46" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11.5" letter-spacing="2.4" fill="#6272a4">// CORE AXIOM</text><text x="46" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="33" font-weight="700" letter-spacing="0.5" fill="#bd93f9" opacity=".35" filter="url(#soft)">Systems &#62; shortcuts. Always.</text><text x="46" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="33" font-weight="700" letter-spacing="0.5" fill="#f8f8f2">Systems &#62; shortcuts. Always.</text><text x="46" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12" fill="#6272a4">A thing that works once is a demo. A thing that works unattended is a product.</text>
